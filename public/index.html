<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cricket Tarot</title>
<style>
  :root{
    --grass:#0b3d2e;
    --grass2:#123f2f;
    --gold:#d9a441;
    --cream:#f4ead2;
    --ink:#1c1810;
    --red:#8c2f2f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:Georgia, 'Times New Roman', serif;
    background:radial-gradient(ellipse at top, var(--grass2), var(--grass) 70%);
    color:var(--cream);
    min-height:100vh;
    padding:24px 16px 40px;
  }
  h1{
    text-align:center;
    font-size:2rem;
    letter-spacing:2px;
    margin-bottom:4px;
    color:var(--gold);
    text-shadow:0 2px 6px rgba(0,0,0,.4);
  }
  .subtitle{
    text-align:center;
    color:var(--cream);
    opacity:.8;
    margin-bottom:22px;
    font-style:italic;
  }

  .chat-shell{
    max-width:760px;
    margin:0 auto;
    background:rgba(0,0,0,.25);
    border:1px solid rgba(217,164,65,.4);
    border-radius:14px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    height:min(74vh, 700px);
    box-shadow:0 10px 26px rgba(0,0,0,.35);
  }
  .chat-log{
    flex:1;
    overflow-y:auto;
    padding:18px 16px 8px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .bubble{
    max-width:84%;
    padding:12px 14px;
    border-radius:14px;
    line-height:1.5;
    font-size:.95rem;
    animation:bubblein .25s ease;
  }
  @keyframes bubblein{
    from{ opacity:0; transform:translateY(6px); }
    to{ opacity:1; transform:none; }
  }
  .bubble.reader{
    align-self:flex-start;
    background:rgba(244,234,210,.97);
    color:var(--ink);
    border-bottom-left-radius:4px;
    box-shadow:0 4px 10px rgba(0,0,0,.25);
  }
  .bubble.reader .who{
    font-size:.68rem;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--red);
    margin-bottom:4px;
  }
  .bubble.reader p{ margin:0 0 8px; }
  .bubble.reader p:last-child{ margin-bottom:0; }
  .bubble.reader ul, .bubble.reader ol{ margin:0 0 8px; padding-left:20px; }
  .bubble.reader strong{ color:var(--red); }
  .bubble.reader code{
    background:rgba(28,24,16,.08);
    padding:1px 5px;
    border-radius:4px;
    font-size:.9em;
  }
  .bubble.user{
    align-self:flex-end;
    background:var(--gold);
    color:var(--ink);
    border-bottom-right-radius:4px;
    font-weight:500;
    white-space:pre-wrap;
  }
  .bubble.typing{
    align-self:flex-start;
    background:rgba(244,234,210,.97);
    padding:12px 16px;
  }
  .typing-dots span{
    display:inline-block;
    width:6px; height:6px;
    margin:0 2px;
    border-radius:50%;
    background:var(--ink);
    opacity:.3;
    animation:blink 1.1s infinite;
  }
  .typing-dots span:nth-child(2){ animation-delay:.2s; }
  .typing-dots span:nth-child(3){ animation-delay:.4s; }
  @keyframes blink{
    0%,80%,100%{ opacity:.25; }
    40%{ opacity:.9; }
  }

  .draw-widget{
    align-self:stretch;
    max-width:100%;
    background:rgba(0,0,0,.18);
    border:1px dashed rgba(217,164,65,.55);
    border-radius:12px;
    padding:14px;
  }
  .draw-widget .prompt{
    text-align:center;
    font-style:italic;
    color:var(--gold);
    margin-bottom:10px;
    font-size:.85rem;
  }
  .draw-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(40px,1fr));
    gap:6px;
    max-width:100%;
    margin:0 auto;
    max-height:326px;
    overflow-y:auto;
    padding:2px;
  }
  .card-back{
    aspect-ratio:2/3;
    border-radius:6px;
    background:
      repeating-linear-gradient(45deg, rgba(217,164,65,.15) 0 5px, transparent 5px 10px),
      linear-gradient(160deg, var(--red), #5e1f1f);
    border:2px solid var(--gold);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    color:var(--gold);
    font-size:.8rem;
    transition:transform .15s ease;
    user-select:none;
  }
  .card-back:hover{ transform:translateY(-3px); }
  .card-back.picked{
    opacity:.25;
    cursor:default;
    transform:none;
  }
  .card-back.disabled{ cursor:default; }
  .card-back.shuffle{
    animation:shuffleJitter .5s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes shuffleJitter{
    0%, 100% { transform:translate(0,0) rotate(0deg); }
    20% { transform:translate(var(--sx1,6px), var(--sy1,-4px)) rotate(var(--sr1,-6deg)); }
    40% { transform:translate(var(--sx2,-5px), var(--sy2,5px)) rotate(var(--sr2,5deg)); }
    60% { transform:translate(var(--sx3,4px), var(--sy3,3px)) rotate(var(--sr3,-4deg)); }
    80% { transform:translate(var(--sx4,-6px), var(--sy4,-3px)) rotate(var(--sr4,6deg)); }
  }

  .drawn-row{
    display:flex;
    gap:12px;
    justify-content:center;
    flex-wrap:wrap;
    margin-top:12px;
  }
  .tcard{
    width:128px;
    background:var(--cream);
    color:var(--ink);
    border-radius:9px;
    border:3px solid var(--gold);
    padding:10px 8px;
    text-align:center;
    box-shadow:0 6px 14px rgba(0,0,0,.35);
    animation:flipin .5s ease;
  }
  @keyframes flipin{
    from{ transform:rotateY(90deg); opacity:0; }
    to{ transform:rotateY(0); opacity:1; }
  }
  .tcard .pos{
    font-size:.62rem;
    letter-spacing:.5px;
    text-transform:uppercase;
    color:var(--red);
    margin-bottom:4px;
  }
  .tcard .name{
    font-weight:bold;
    font-size:.92rem;
    margin-bottom:2px;
  }
  .tcard .orient{
    font-size:.7rem;
    font-style:italic;
    opacity:.75;
    margin-bottom:5px;
  }
  .tcard .trad{
    font-size:.62rem;
    opacity:.55;
  }
  .tcard .kind{
    margin-top:5px;
    font-size:.56rem;
    letter-spacing:.6px;
    text-transform:uppercase;
    color:var(--red);
    opacity:.75;
  }

  .composer{
    display:flex;
    gap:8px;
    padding:12px 14px;
    border-top:1px solid rgba(217,164,65,.3);
  }
  .composer textarea{
    flex:1;
    resize:none;
    min-height:44px;
    max-height:120px;
    border-radius:8px;
    border:1px solid rgba(217,164,65,.5);
    background:rgba(244,234,210,.95);
    color:var(--ink);
    font-family:inherit;
    font-size:.95rem;
    padding:10px 12px;
  }
  .composer textarea:disabled{ opacity:.55; cursor:not-allowed; }
  button{
    font-family:inherit;
    font-size:.95rem;
    padding:8px 16px;
    border-radius:8px;
    border:1px solid var(--gold);
    background:var(--gold);
    color:var(--ink);
    cursor:pointer;
    font-weight:bold;
  }
  button:hover{ filter:brightness(1.08); }
  button:disabled{ opacity:.5; cursor:not-allowed; }
  .composer-foot{
    display:flex;
    justify-content:center;
    padding:0 14px 14px;
  }
  #resetBtn{
    background:transparent;
    color:var(--cream);
    border:1px solid rgba(244,234,210,.35);
    font-weight:normal;
    font-size:.78rem;
    padding:5px 12px;
  }

  .sound-toggle{
    position:fixed;
    top:14px; right:14px;
    background:rgba(0,0,0,.3);
    border:1px solid rgba(217,164,65,.5);
    color:var(--gold);
    font-size:1rem;
    font-weight:normal;
    padding:6px 10px;
    border-radius:8px;
    z-index:6;
  }
  .sound-toggle.off{ opacity:.5; }

  .spread-badge{
    display:block;
    width:fit-content;
    margin:0 auto 8px;
    background:rgba(217,164,65,.16);
    border:1px solid rgba(217,164,65,.5);
    color:var(--gold);
    font-size:.66rem;
    letter-spacing:1.5px;
    text-transform:uppercase;
    padding:3px 11px;
    border-radius:999px;
  }
  .draw-widget .reason{
    text-align:center;
    color:var(--cream);
    opacity:.92;
    font-size:.9rem;
    font-style:italic;
    margin-bottom:8px;
  }

  footer{
    text-align:center;
    margin-top:20px;
    font-size:.75rem;
    opacity:.6;
  }
</style>
</head>
<body>

<button id="soundBtn" class="sound-toggle" title="Sound on/off" aria-label="Toggle sound">🔊</button>

<h1>🏏 Cricket Tarot</h1>
<div class="subtitle">Let the universe speak to you in the language of cricket.</div>

<div class="chat-shell">
  <div class="chat-log" id="chatLog"></div>
  <div class="composer">
    <textarea id="msgInput" placeholder="Say what's on your mind…" rows="1"></textarea>
    <button id="sendBtn">Send</button>
  </div>
  <div class="composer-foot">
    <button id="resetBtn">New Reading</button>
  </div>
</div>

<footer>Cricket Tarot Reader · conversational AI agent demo · 78-card deck</footer>

<script>
// The full 78-card deck is loaded from cricket_tarot_deck.json at startup.
let DECK = { cards: [] };
async function loadDeck(){
  try {
    const r = await fetch('cricket_tarot_deck.json', { cache: 'no-cache' });
    if (r.ok) DECK = await r.json();
  } catch (e) {
    console.error('Deck failed to load:', e);
  }
  return DECK;
}

const GREETING = "Alright, pads on. Tell me what's on your mind — or just say 'deal me one' and I'll pull a card and we'll see what the pitch has in store.";
const MAX_TOTAL_CARDS = 14;
const SHUFFLE_MS = 1200;

// --- Ground effects: everything synthesised, no audio files ---
const Sound = (() => {
  let ctx, master;
  let enabled = true;
  try { enabled = localStorage.getItem('ct_sound') !== 'off'; } catch (e) {}

  function ensure(){
    if (!ctx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = 0.35;
      master.connect(ctx.destination);
    }
    if (ctx.state === 'suspended') ctx.resume();
  }

  function noiseBuffer(dur){
    const n = Math.max(1, Math.floor(ctx.sampleRate * dur));
    const buf = ctx.createBuffer(1, n, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    return buf;
  }

  function shuffle(){
    if (!enabled) return; ensure(); if (!ctx) return;
    const t0 = ctx.currentTime;
    for (let i = 0; i < 7; i++){
      const t = t0 + i * 0.085 + Math.random() * 0.03;
      const src = ctx.createBufferSource(); src.buffer = noiseBuffer(0.05);
      const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 2600;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.5, t + 0.005);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
      src.connect(hp).connect(g).connect(master);
      src.start(t); src.stop(t + 0.06);
    }
  }

  function batCrack(){
    if (!enabled) return; ensure(); if (!ctx) return;
    const t = ctx.currentTime;
    const src = ctx.createBufferSource(); src.buffer = noiseBuffer(0.18);
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1900; bp.Q.value = 0.9;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(1, t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
    src.connect(bp).connect(g).connect(master);
    src.start(t); src.stop(t + 0.2);
    const o = ctx.createOscillator(); o.type = 'triangle';
    o.frequency.setValueAtTime(190, t); o.frequency.exponentialRampToValueAtTime(90, t + 0.12);
    const og = ctx.createGain();
    og.gain.setValueAtTime(0.6, t); og.gain.exponentialRampToValueAtTime(0.0001, t + 0.13);
    o.connect(og).connect(master); o.start(t); o.stop(t + 0.14);
  }

  function crowdSwell(){
    if (!enabled) return; ensure(); if (!ctx) return;
    const t = ctx.currentTime;
    const src = ctx.createBufferSource(); src.buffer = noiseBuffer(1.6);
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 700; bp.Q.value = 0.5;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.14, t + 0.4);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 1.5);
    src.connect(bp).connect(g).connect(master);
    src.start(t); src.stop(t + 1.6);
  }

  function blip(){
    if (!enabled) return; ensure(); if (!ctx) return;
    const t = ctx.currentTime;
    const o = ctx.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(2400, t); o.frequency.exponentialRampToValueAtTime(1150, t + 0.15);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.4, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.4);
    o.connect(g).connect(master); o.start(t); o.stop(t + 0.42);
  }

  function setEnabled(v){
    enabled = v;
    try { localStorage.setItem('ct_sound', v ? 'on' : 'off'); } catch (e) {}
  }

  return { ensure, shuffle, batCrack, crowdSwell, blip, setEnabled, isEnabled: () => enabled };
})();

let history = [];
let totalCardsDrawn = 0;
let busy = false;

const chatLog = document.getElementById('chatLog');
const msgInput = document.getElementById('msgInput');
const sendBtn = document.getElementById('sendBtn');
const resetBtn = document.getElementById('resetBtn');
const soundBtn = document.getElementById('soundBtn');

function escapeHtml(str){
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function inlineMarkdown(text){
  return text
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/__(.+?)__/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/_(.+?)_/g, '<em>$1</em>')
    .replace(/`(.+?)`/g, '<code>$1</code>');
}

function renderMarkdown(raw){
  const blocks = escapeHtml(raw).trim().split(/\n\s*\n/);
  return blocks.map(block => {
    const lines = block.split('\n').map(l => l.trim()).filter(Boolean);
    if (lines.length && lines.every(l => /^[-*]\s+/.test(l))){
      return `<ul>${lines.map(l => `<li>${inlineMarkdown(l.replace(/^[-*]\s+/, ''))}</li>`).join('')}</ul>`;
    }
    if (lines.length && lines.every(l => /^\d+[.)]\s+/.test(l))){
      return `<ol>${lines.map(l => `<li>${inlineMarkdown(l.replace(/^\d+[.)]\s+/, ''))}</li>`).join('')}</ol>`;
    }
    return `<p>${inlineMarkdown(block).replace(/\n/g, '<br>')}</p>`;
  }).join('');
}

function jitter(){ return (Math.random() * 16 - 8) + 'px'; }
function jitterDeg(){ return (Math.random() * 16 - 8) + 'deg'; }

function scrollToBottom(){
  chatLog.scrollTop = chatLog.scrollHeight;
}

function addBubble(role, text){
  const el = document.createElement('div');
  el.className = `bubble ${role}`;
  if (role === 'reader'){
    el.innerHTML = `<div class="who">The Reader</div>${renderMarkdown(text)}`;
  } else {
    el.textContent = text;
  }
  chatLog.appendChild(el);
  scrollToBottom();
  return el;
}

function addTypingBubble(){
  const el = document.createElement('div');
  el.className = 'bubble typing';
  el.innerHTML = `<div class="typing-dots"><span></span><span></span><span></span></div>`;
  chatLog.appendChild(el);
  scrollToBottom();
  return el;
}

function setBusy(b){
  busy = b;
  sendBtn.disabled = b;
  msgInput.disabled = b;
}

async function callAgent(){
  const typingEl = addTypingBubble();
  setBusy(true);
  try {
    const resp = await fetch('/.netlify/functions/reading', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history })
    });
    const data = await resp.json();
    typingEl.remove();
    if (!resp.ok) {
      throw new Error(data.error || `Request failed (${resp.status})`);
    }

    const message = data.message;
    history.push(message);

    if (message.content && message.content.trim()){
      addBubble('reader', message.content.trim());
    }

    const toolCalls = message.tool_calls || [];
    if (toolCalls.length > 0){
      await handleToolCall(toolCalls[0]);
    } else {
      setBusy(false);
    }
  } catch (err) {
    typingEl.remove();
    addBubble('reader', `Rain's stopped play — I couldn't reach the pitch report (${err.message}). If this is a fresh deploy, make sure OPENROUTER_API_KEY is set under Site configuration → Environment variables in Netlify, then try again.`);
    setBusy(false);
  }
}

async function handleToolCall(toolCall){
  let args = {};
  try { args = JSON.parse(toolCall.function.arguments || '{}'); } catch (e) {}

  if (!DECK.cards || DECK.cards.length === 0) await loadDeck();

  const count = Math.max(1, Math.min(10, parseInt(args.count, 10) || 1));
  const positions = Array.isArray(args.positions) ? args.positions.slice(0, count) : [];
  while (positions.length < count) positions.push(`Card ${positions.length + 1}`);

  const reason = typeof args.reason === 'string' ? args.reason.trim() : '';
  let spread = typeof args.spread === 'string' ? args.spread.trim() : '';
  if (/^single$/i.test(spread)) spread = '';

  if (totalCardsDrawn + count > MAX_TOTAL_CARDS){
    history.push({
      role: 'tool',
      tool_call_id: toolCall.id,
      name: 'draw_cards',
      content: JSON.stringify({ error: `That's plenty of cards for one sitting (${totalCardsDrawn} drawn already). Wrap up the reading with what's already on the table instead of drawing more.` })
    });
    await callAgent();
    return;
  }

  const widget = document.createElement('div');
  widget.className = 'bubble reader draw-widget';
  widget.innerHTML =
    (spread ? `<div class="spread-badge">${escapeHtml(spread)} spread</div>` : '') +
    (reason ? `<div class="reason">${escapeHtml(reason)}</div>` : '') +
    `<div class="prompt">Shuffling the deck…</div><div class="draw-grid"></div><div class="drawn-row"></div>`;
  chatLog.appendChild(widget);
  Sound.shuffle();
  scrollToBottom();

  const grid = widget.querySelector('.draw-grid');
  const drawnRow = widget.querySelector('.drawn-row');
  const promptEl = widget.querySelector('.prompt');

  DECK.cards.forEach((c, i) => {
    const d = document.createElement('div');
    d.className = 'card-back shuffle';
    d.textContent = '🏏';
    d.dataset.idx = i;
    ['1','2','3','4'].forEach(n => {
      d.style.setProperty(`--sx${n}`, jitter());
      d.style.setProperty(`--sy${n}`, jitter());
      d.style.setProperty(`--sr${n}`, jitterDeg());
    });
    d.style.animationDelay = (Math.random() * 0.3) + 's';
    grid.appendChild(d);
  });

  setTimeout(() => {
    Array.from(grid.children).forEach(c => c.classList.remove('shuffle'));
    promptEl.textContent = count === 1 ? 'Pick a card…' : `Pick ${count} cards…`;
    Sound.shuffle();
  }, SHUFFLE_MS);
  scrollToBottom();

  const drawnCards = await new Promise(resolve => {
    const picked = [];
    Array.from(grid.children).forEach(cardEl => {
      cardEl.addEventListener('click', () => {
        if (cardEl.classList.contains('shuffle') || cardEl.classList.contains('picked')) return;
        if (picked.length >= count) return;

        const idx = parseInt(cardEl.dataset.idx, 10);
        cardEl.classList.add('picked');
        Sound.batCrack();

        const card = DECK.cards[idx];
        const orientation = Math.random() < 0.75 ? 'upright' : 'reversed';
        const position = positions[picked.length];
        picked.push({ position, card, orientation });

        const kindLabel = !card.suit
          ? 'Major Arcana'
          : (String(card.rank || '').startsWith('The') ? `${card.suit} · Court` : card.suit);

        const t = document.createElement('div');
        t.className = 'tcard';
        t.innerHTML = `
          <div class="pos">${position}</div>
          <div class="name">${card.name}</div>
          <div class="orient">${orientation === 'upright' ? 'Upright' : 'Reversed'}</div>
          <div class="trad">(${card.traditional})</div>
          <div class="kind">${kindLabel}</div>
        `;
        drawnRow.appendChild(t);
        scrollToBottom();

        if (picked.length === count){
          Array.from(grid.children).forEach(c => c.classList.add('disabled'));
          promptEl.textContent = 'Drawn.';
          Sound.crowdSwell();
          resolve(picked);
        } else {
          promptEl.textContent = `Pick ${count - picked.length} more…`;
        }
      });
    });
  });

  totalCardsDrawn += count;

  const cardsPayload = drawnCards.map(({ position, card, orientation }) => ({
    position,
    name: card.name,
    traditional: card.traditional,
    suit: card.suit || 'Major Arcana',
    kind: !card.suit
      ? 'Major Arcana'
      : (String(card.rank || '').startsWith('The') ? 'Court card' : 'Pip card'),
    orientation,
    cricketMeaning: card.cricketMeaning,
    upright: card.upright,
    reversed: card.reversed
  }));

  history.push({
    role: 'tool',
    tool_call_id: toolCall.id,
    name: 'draw_cards',
    content: JSON.stringify({ cards: cardsPayload })
  });

  await callAgent();
}

function sendMessage(){
  const text = msgInput.value.trim();
  if (!text || busy) return;
  history.push({ role: 'user', content: text });
  addBubble('user', text);
  msgInput.value = '';
  autosize();
  callAgent();
}

function autosize(){
  msgInput.style.height = 'auto';
  msgInput.style.height = Math.min(120, msgInput.scrollHeight) + 'px';
}

function resetAll(){
  history = [{ role: 'assistant', content: GREETING }];
  totalCardsDrawn = 0;
  chatLog.innerHTML = '';
  msgInput.value = '';
  autosize();
  setBusy(false);
  addBubble('reader', GREETING);
}

function syncSoundBtn(){
  const on = Sound.isEnabled();
  soundBtn.textContent = on ? '🔊' : '🔇';
  soundBtn.classList.toggle('off', !on);
}

sendBtn.addEventListener('click', sendMessage);
msgInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
});
msgInput.addEventListener('input', autosize);
resetBtn.addEventListener('click', resetAll);
soundBtn.addEventListener('click', () => {
  Sound.ensure();
  Sound.setEnabled(!Sound.isEnabled());
  syncSoundBtn();
  if (Sound.isEnabled()) Sound.blip();
});

syncSoundBtn();
resetAll();
loadDeck();
</script>

</body>
</html>
