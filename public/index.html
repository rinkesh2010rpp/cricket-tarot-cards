<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cricket Tarot</title>
<style>
  :root{
    --grass:#0b3d2e;
    --grass2:#123f2f;
    --gold:#d9a441;
    --cream:#f4ead2;
    --ink:#1c1810;
    --red:#8c2f2f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:Georgia, 'Times New Roman', serif;
    background:radial-gradient(ellipse at top, var(--grass2), var(--grass) 70%);
    color:var(--cream);
    min-height:100vh;
    padding:24px 16px 40px;
  }
  h1{
    text-align:center;
    font-size:2rem;
    letter-spacing:2px;
    margin-bottom:4px;
    color:var(--gold);
    text-shadow:0 2px 6px rgba(0,0,0,.4);
  }
  .subtitle{
    text-align:center;
    color:var(--cream);
    opacity:.8;
    margin-bottom:22px;
    font-style:italic;
  }

  .chat-shell{
    max-width:760px;
    margin:0 auto;
    background:rgba(0,0,0,.25);
    border:1px solid rgba(217,164,65,.4);
    border-radius:14px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    height:min(74vh, 700px);
    box-shadow:0 10px 26px rgba(0,0,0,.35);
  }
  .chat-log{
    flex:1;
    overflow-y:auto;
    padding:18px 16px 8px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .bubble{
    max-width:84%;
    padding:12px 14px;
    border-radius:14px;
    line-height:1.5;
    font-size:.95rem;
    animation:bubblein .25s ease;
  }
  @keyframes bubblein{
    from{ opacity:0; transform:translateY(6px); }
    to{ opacity:1; transform:none; }
  }
  .bubble.reader{
    align-self:flex-start;
    background:rgba(244,234,210,.97);
    color:var(--ink);
    border-bottom-left-radius:4px;
    box-shadow:0 4px 10px rgba(0,0,0,.25);
  }
  .bubble.reader .who{
    font-size:.68rem;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--red);
    margin-bottom:4px;
  }
  .bubble.reader p{ margin:0 0 8px; }
  .bubble.reader p:last-child{ margin-bottom:0; }
  .bubble.reader ul, .bubble.reader ol{ margin:0 0 8px; padding-left:20px; }
  .bubble.reader strong{ color:var(--red); }
  .bubble.reader code{
    background:rgba(28,24,16,.08);
    padding:1px 5px;
    border-radius:4px;
    font-size:.9em;
  }
  .bubble.user{
    align-self:flex-end;
    background:var(--gold);
    color:var(--ink);
    border-bottom-right-radius:4px;
    font-weight:500;
    white-space:pre-wrap;
  }
  .bubble.typing{
    align-self:flex-start;
    background:rgba(244,234,210,.97);
    padding:12px 16px;
  }
  .typing-dots span{
    display:inline-block;
    width:6px; height:6px;
    margin:0 2px;
    border-radius:50%;
    background:var(--ink);
    opacity:.3;
    animation:blink 1.1s infinite;
  }
  .typing-dots span:nth-child(2){ animation-delay:.2s; }
  .typing-dots span:nth-child(3){ animation-delay:.4s; }
  @keyframes blink{
    0%,80%,100%{ opacity:.25; }
    40%{ opacity:.9; }
  }

  .draw-widget{
    align-self:stretch;
    max-width:100%;
    background:rgba(0,0,0,.18);
    border:1px dashed rgba(217,164,65,.55);
    border-radius:12px;
    padding:14px;
  }
  .draw-widget .prompt{
    text-align:center;
    font-style:italic;
    color:var(--gold);
    margin-bottom:10px;
    font-size:.85rem;
  }
  .draw-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(52px,1fr));
    gap:7px;
    max-width:460px;
    margin:0 auto;
  }
  .card-back{
    aspect-ratio:2/3;
    border-radius:7px;
    background:
      repeating-linear-gradient(45deg, rgba(217,164,65,.15) 0 6px, transparent 6px 12px),
      linear-gradient(160deg, var(--red), #5e1f1f);
    border:2px solid var(--gold);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    color:var(--gold);
    font-size:.95rem;
    transition:transform .15s ease;
    user-select:none;
  }
  .card-back:hover{ transform:translateY(-3px); }
  .card-back.picked{
    opacity:.25;
    cursor:default;
    transform:none;
  }
  .card-back.disabled{ cursor:default; }
  .card-back.shuffle{
    animation:shuffleJitter .5s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes shuffleJitter{
    0%, 100% { transform:translate(0,0) rotate(0deg); }
    20% { transform:translate(var(--sx1,6px), var(--sy1,-4px)) rotate(var(--sr1,-6deg)); }
    40% { transform:translate(var(--sx2,-5px), var(--sy2,5px)) rotate(var(--sr2,5deg)); }
    60% { transform:translate(var(--sx3,4px), var(--sy3,3px)) rotate(var(--sr3,-4deg)); }
    80% { transform:translate(var(--sx4,-6px), var(--sy4,-3px)) rotate(var(--sr4,6deg)); }
  }

  .drawn-row{
    display:flex;
    gap:12px;
    justify-content:center;
    flex-wrap:wrap;
    margin-top:12px;
  }
  .tcard{
    width:128px;
    background:var(--cream);
    color:var(--ink);
    border-radius:9px;
    border:3px solid var(--gold);
    padding:10px 8px;
    text-align:center;
    box-shadow:0 6px 14px rgba(0,0,0,.35);
    animation:flipin .5s ease;
  }
  @keyframes flipin{
    from{ transform:rotateY(90deg); opacity:0; }
    to{ transform:rotateY(0); opacity:1; }
  }
  .tcard .pos{
    font-size:.62rem;
    letter-spacing:.5px;
    text-transform:uppercase;
    color:var(--red);
    margin-bottom:4px;
  }
  .tcard .name{
    font-weight:bold;
    font-size:.92rem;
    margin-bottom:2px;
  }
  .tcard .orient{
    font-size:.7rem;
    font-style:italic;
    opacity:.75;
    margin-bottom:5px;
  }
  .tcard .trad{
    font-size:.62rem;
    opacity:.55;
  }

  .composer{
    display:flex;
    gap:8px;
    padding:12px 14px;
    border-top:1px solid rgba(217,164,65,.3);
  }
  .composer textarea{
    flex:1;
    resize:none;
    min-height:44px;
    max-height:120px;
    border-radius:8px;
    border:1px solid rgba(217,164,65,.5);
    background:rgba(244,234,210,.95);
    color:var(--ink);
    font-family:inherit;
    font-size:.95rem;
    padding:10px 12px;
  }
  .composer textarea:disabled{ opacity:.55; cursor:not-allowed; }
  button{
    font-family:inherit;
    font-size:.95rem;
    padding:8px 16px;
    border-radius:8px;
    border:1px solid var(--gold);
    background:var(--gold);
    color:var(--ink);
    cursor:pointer;
    font-weight:bold;
  }
  button:hover{ filter:brightness(1.08); }
  button:disabled{ opacity:.5; cursor:not-allowed; }
  .composer-foot{
    display:flex;
    justify-content:center;
    padding:0 14px 14px;
  }
  #resetBtn{
    background:transparent;
    color:var(--cream);
    border:1px solid rgba(244,234,210,.35);
    font-weight:normal;
    font-size:.78rem;
    padding:5px 12px;
  }

  footer{
    text-align:center;
    margin-top:20px;
    font-size:.75rem;
    opacity:.6;
  }
</style>
</head>

nct."}, {"id": 3, "name": "The Home Ground", "traditional": "The Empress", "keywords": ["abundance", "comfort", "nurturing conditions", "growth"], "cricketMeaning": "A flat pitch, a friendly crowd, familiar conditions — everything set up for you to flourish.", "upright": "Conditions favor you right now. Let yourself be supported, grow into the innings, and don't rush what's naturally building in your favor.", "reversed": "Home comfort turning into complacency, or a supportive environment being taken for granted. Don't let easy conditions make you lazy."}, {"id": 4, "name": "The Captain", "traditional": "The Emperor", "keywords": ["leadership", "structure", "authority", "responsibility"], "cricketMeaning": "The one setting the field, making the calls, carrying the weight of every decision.", "upright": "Step up and take control. A situation needs your structure and decisiveness — set the field, make the call, own the outcome.", "reversed": "Over-control or rigid captaincy that stifles the team. You're micromanaging the field instead of trusting your bowlers. Loosen the grip."}, {"id": 5, "name": "The Coach", "traditional": "The Hierophant", "keywords": ["tradition", "mentorship", "learning the fundamentals"], "cricketMeaning": "The voice in the nets reminding you of technique, discipline, and the basics that never go out of style.", "upright": "Go back to fundamentals. A mentor, a coaching manual, or plain old discipline has the answer you're looking for. Respect the process.", "reversed": "Blindly following outdated advice, or rejecting all guidance out of stubbornness. Question the method, but don't throw out the technique entirely."}, {"id": 6, "name": "The Partnership", "traditional": "The Lovers", "keywords": ["connection", "choice", "trust between two"], "cricketMeaning": "Two batsmen at the crease, running on trust, building something neither could alone.", "upright": "A relationship or collaboration is at a turning point — commit to it fully. Communicate clearly, run the singles, trust your partner.", "reversed": "A breakdown in communication — a mix-up, a run-out waiting to happen. Miscommunication is the real danger here, not the opposition."}, {"id": 7, "name": "The Chase", "traditional": "The Chariot", "keywords": ["determination", "momentum", "willpower", "victory through focus"], "cricketMeaning": "Batting under lights, required run rate climbing, nothing but forward momentum and nerve.", "upright": "Full steam ahead. You have the drive to pull this off — stay focused on the target and don't let doubt slow your running between the wickets.", "reversed": "Losing control of the chase — panicking, changing plans mid-over, or trying to do too much too fast. Reset and rebuild the required rate calmly."}, {"id": 8, "name": "The Anchor", "traditional": "Strength", "keywords": ["quiet resolve", "patience", "inner control"], "cricketMeaning": "The batsman who holds one end steady through a collapse, absorbing pressure without flinching.", "upright": "Real strength here is calm, not aggression. Hold your position, absorb the pressure, and let the storm around you pass without losing your composure.", "reversed": "Forcing control through stubbornness, or crumbling under pressure you tried to just 'tough out.' Strength without patience becomes brittle."}, {"id": 9, "name": "The Twelfth Man", "traditional": "The Hermit", "keywords": ["reflection", "solitude", "waiting your turn"], "cricketMeaning": "Watching from the boundary, drinks tray in hand, learning the game from the outside looking in.", "upright": "Step back and observe before acting. This is a season for quiet reflection, not center stage — your moment will come, use this time to prepare.", "reversed": "Isolating yourself when you should be engaging, or feeling permanently overlooked. Don't mistake being benched for being forgotten."}, {"id": 10, "name": "The Toss", "traditional": "Wheel of Fortune", "keywords": ["luck", "turning point", "cycles", "chance"], "cricket that's already happened. Walk off before you're given out."}, {"id": 14, "name": "The Declaration", "traditional": "Temperance", "keywords": ["balance", "timing", "moderation"], "cricketMeaning": "The captain choosing exactly the right moment to stop batting — not too early, not too greedy.", "upright": "Balance and good timing matter more than pushing for more. You have enough — declare, and set up the next phase from a position of strength.", "reversed": "Bad timing — declaring too early out of impatience, or batting on too long out of greed. Reassess what 'enough' actually looks like."}, {"id": 15, "name": "The Sledge", "traditional": "The Devil", "keywords": ["temptation", "ego", "bad habits", "provocation"], "cricketMeaning": "Words from the slip cordon designed to get in your head — a test of what you'll let control you.", "upright": "Something is baiting your ego — a rivalry, a grudge, a bad habit dressed up as competitive fire. Notice what's pulling your focus off the game.", "reversed": "Breaking free from a temptation or toxic pattern that's had a grip on you. You're learning to let the sledging go unanswered."}, {"id": 16, "name": "The Collapse", "traditional": "The Tower", "keywords": ["sudden disruption", "upheaval", "forced change"], "cricketMeaning": "Five wickets in five overs — the innings falling apart faster than anyone expected.", "upright": "A sudden, disruptive event is dismantling something that looked stable. It's disorienting, but it's clearing out what wasn't built to last anyway.", "reversed": "Fearing a collapse that hasn't happened yet, or narrowly avoiding one. Don't let anxiety about falling apart cost you the innings that's still in front of you."}, {"id": 17, "name": "The Comeback", "traditional": "The Star", "keywords": ["hope", "renewal", "healing", "quiet faith"], "cricketMeaning": "Returning to the field after injury or a lean patch, quietly rebuilding form and belief.", "upright": "Hope is well placed here. After a difficult stretch, healing and form are genuinely returning — trust the quiet signs of recovery.", "reversed": "Losing faith just before the turnaround, or rushing the comeback before you're truly ready. Give the recovery the time it needs."}, {"id": 18, "name": "The Floodlights", "traditional": "The Moon", "keywords": ["uncertainty", "illusion", "dew factor", "unclear conditions"], "cricketMeaning": "A day-night match under lights and dew — the ball behaving strangely, nothing quite as it seems.", "upright": "Things aren't fully clear right now, and that's okay. Move carefully through the uncertainty rather than assuming you can read conditions you can't yet see.", "reversed": "Confusion lifting, or anxiety about the unknown that's bigger than the situation warrants. The dew will settle — don't panic-bowl at shadows."}, {"id": 19, "name": "The Century", "traditional": "The Sun", "keywords": ["success", "joy", "vindication", "clarity"], "cricketMeaning": "Bat raised to the crowd, three figures on the board — pure, uncomplicated triumph.", "upright": "Genuine success and joy are here, earned and deserved. Let yourself enjoy this moment fully — no caveats needed.", "reversed": "Success that feels hollow, or joy you're not allowing yourself to feel. Don't undersell a century just because it wasn't a double."}, {"id": 20, "name": "The Review", "traditional": "Judgement", "keywords": ["reckoning", "second chances", "calling back"], "cricketMeaning": "Bat tucked under the arm, waiting on the big screen — a decision from the past being revisited and made right.", "upright": "A past decision is being reconsidered, and you may get the reprieve you've been hoping for. Trust the review process and be honest about what really happened.", "reversed": "Refusing to review your own mistakes, or burning a review on false hope. Be honest with yourself before you ask for a second look."}, {"id": 21, "name": "The World Cup", "traditional": "The World", "keywords": ["completion", "achievement", "wholeness", "arrival"], "cricketMeaning": "The trophy lifted, the long tournament finally complete — everything you worked for, whole and realized.", "upright": "A long cycle is reaching genuine completion. Whatever you've been building toward has arrived — take it in before starting the next campaign.", "reversed": "Something close to completion but not quite there — a final short of the boundary. Don't stop chasing just before the finish line."}]};

const GREETING = "Alright, pads on. Tell me what's on your mind — or just say 'deal me one' and I'll pull a card and we'll see what the pitch has in store.";
const MAX_TOTAL_CARDS = 9;
const SHUFFLE_MS = 1200;

let history = [];
let totalCardsDrawn = 0;
let busy = false;

const chatLog = document.getElementById('chatLog');
const msgInput = document.getElementById('msgInput');
const sendBtn = document.getElementById('sendBtn');
const resetBtn = document.getElementById('resetBtn');

function escapeHtml(str){
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function inlineMarkdown(text){
  return text
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/__(.+?)__/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/_(.+?)_/g, '<em>$1</em>')
    .replace(/`(.+?)`/g, '<code>$1</code>');
}

function renderMarkdown(raw){
  const blocks = escapeHtml(raw).trim().split(/\n\s*\n/);
  return blocks.map(block => {
    const lines = block.split('\n').map(l => l.trim()).filter(Boolean);
    if (lines.length && lines.every(l => /^[-*]\s+/.test(l))){
      return `<ul>${lines.map(l => `<li>${inlineMarkdown(l.replace(/^[-*]\s+/, ''))}</li>`).join('')}</ul>`;
    }
    if (lines.length && lines.every(l => /^\d+[.)]\s+/.test(l))){
      return `<ol>${lines.map(l => `<li>${inlineMarkdown(l.replace(/^\d+[.)]\s+/, ''))}</li>`).join('')}</ol>`;
    }
    return `<p>${inlineMarkdown(block).replace(/\n/g, '<br>')}</p>`;
  }).join('');
}

function jitter(){ return (Math.random() * 16 - 8) + 'px'; }
function jitterDeg(){ return (Math.random() * 16 - 8) + 'deg'; }

function scrollToBottom(){
  chatLog.scrollTop = chatLog.scrollHeight;
}

function addBubble(role, text){
  const el = document.createElement('div');
  el.className = `bubble ${role}`;
  if (role === 'reader'){
    el.innerHTML = `<div class="who">The Reader</div>${renderMarkdown(text)}`;
  } else {
    el.textContent = text;
  }
  chatLog.appendChild(el);
  scrollToBottom();
  return el;
}

function addTypingBubble(){
  const el = document.createElement('div');
  el.className = 'bubble typing';
  el.innerHTML = `<div class="typing-dots"><span></span><span></span><span></span></div>`;
  chatLog.appendChild(el);
  scrollToBottom();
  return el;
}

function setBusy(b){
  busy = b;
  sendBtn.disabled = b;
  msgInput.disabled = b;
}

async function callAgent(){
  const typingEl = addTypingBubble();
  setBusy(true);
  try {
    const resp = await fetch('/.netlify/functions/reading', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history })
    });
    const data = await resp.json();
    typingEl.remove();
    if (!resp.ok) {
      throw new Error(data.error || `Request failed (${resp.status})`);
    }

    const message = data.message;
    history.push(message);

    if (message.content && message.content.trim()){
      addBubble('reader', message.content.trim());
    }

    const toolCalls = message.tool_calls || [];
    if (toolCalls.length > 0){
      await handleToolCall(toolCalls[0]);
    } else {
      setBusy(false);
    }
  } catch (err) {
    typingEl.remove();
    addBubble('reader', `Rain's stopped play — I couldn't reach the pitch report (${err.message}). If this is a fresh deploy, make sure OPENROUTER_API_KEY is set under Site configuration → Environment variables in Netlify, then try again.`);
    setBusy(false);
  }
}

async function handleToolCall(toolCall){
  let args = {};
  try { args = JSON.parse(toolCall.function.arguments || '{}'); } catch (e) {}

  const count = Math.max(1, Math.min(5, parseInt(args.count, 10) || 1));
  const positions = Array.isArray(args.positions) ? args.positions.slice(0, count) : [];
  while (positions.length < count) positions.push(`Card ${positions.length + 1}`);

  if (totalCardsDrawn + count > MAX_TOTAL_CARDS){
    history.push({
      role: 'tool',
      tool_call_id: toolCall.id,
      name: 'draw_cards',
      content: JSON.stringify({ error: `That's plenty of cards for one sitting (${totalCardsDrawn} drawn already). Wrap up the reading with what's already on the table instead of drawing more.` })
    });
    await callAgent();
    return;
  }

  const widget = document.createElement('div');
  widget.className = 'bubble reader draw-widget';
  widget.innerHTML = `<div class="prompt">Shuffling the deck…</div><div class="draw-grid"></div><div class="drawn-row"></div>`;
  chatLog.appendChild(widget);
  scrollToBottom();

  const grid = widget.querySelector('.draw-grid');
  const drawnRow = widget.querySelector('.drawn-row');
  const promptEl = widget.querySelector('.prompt');

  DECK.cards.forEach((c, i) => {
    const d = document.createElement('div');
    d.className = 'card-back shuffle';
    d.textContent = '🏏';
    d.dataset.idx = i;
    ['1','2','3','4'].forEach(n => {
      d.style.setProperty(`--sx${n}`, jitter());
      d.style.setProperty(`--sy${n}`, jitter());
      d.style.setProperty(`--sr${n}`, jitterDeg());
    });
    d.style.animationDelay = (Math.random() * 0.3) + 's';
    grid.appendChild(d);
  });

  setTimeout(() => {
    Array.from(grid.children).forEach(c => c.classList.remove('shuffle'));
    promptEl.textContent = count === 1 ? 'Pick a card…' : `Pick ${count} cards…`;
  }, SHUFFLE_MS);
  scrollToBottom();

  const drawnCards = await new Promise(resolve => {
    const picked = [];
    Array.from(grid.children).forEach(cardEl => {
      cardEl.addEventListener('click', () => {
        if (cardEl.classList.contains('shuffle') || cardEl.classList.contains('picked')) return;
        if (picked.length >= count) return;

        const idx = parseInt(cardEl.dataset.idx, 10);
        cardEl.classList.add('picked');

        const card = DECK.cards[idx];
        const orientation = Math.random() < 0.75 ? 'upright' : 'reversed';
        const position = positions[picked.length];
        picked.push({ position, card, orientation });

        const t = document.createElement('div');
        t.className = 'tcard';
        t.innerHTML = `
          <div class="pos">${position}</div>
          <div class="name">${card.name}</div>
          <div class="orient">${orientation === 'upright' ? 'Upright' : 'Reversed'}</div>
          <div class="trad">(${card.traditional})</div>
        `;
        drawnRow.appendChild(t);
        scrollToBottom();

        if (picked.length === count){
          Array.from(grid.children).forEach(c => c.classList.add('disabled'));
          promptEl.textContent = 'Drawn.';
          resolve(picked);
        } else {
          promptEl.textContent = `Pick ${count - picked.length} more…`;
        }
      });
    });
  });

  totalCardsDrawn += count;

  const cardsPayload = drawnCards.map(({ position, card, orientation }) => ({
    position,
    name: card.name,
    traditional: card.traditional,
    orientation,
    cricketMeaning: card.cricketMeaning,
    upright: card.upright,
    reversed: card.reversed
  }));

  history.push({
    role: 'tool',
    tool_call_id: toolCall.id,
    name: 'draw_cards',
    content: JSON.stringify({ cards: cardsPayload })
  });

  await callAgent();
}

function sendMessage(){
  const text = msgInput.value.trim();
  if (!text || busy) return;
  history.push({ role: 'user', content: text });
  addBubble('user', text);
  msgInput.value = '';
  autosize();
  callAgent();
}

function autosize(){
  msgInput.style.height = 'auto';
  msgInput.style.height = Math.min(120, msgInput.scrollHeight) + 'px';
}

function resetAll(){
  history = [{ role: 'assistant', content: GREETING }];
  totalCardsDrawn = 0;
  chatLog.innerHTML = '';
  msgInput.value = '';
  autosize();
  setBusy(false);
  addBubble('reader', GREETING);
}

sendBtn.addEventListener('click', sendMessage);
msgInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
});
msgInput.addEventListener('input', autosize);
resetBtn.addEventListener('click', resetAll);

resetAll();
</script>
